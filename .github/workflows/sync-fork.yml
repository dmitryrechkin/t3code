name: Sync fork with upstream

on:
  schedule:
    # Hourly at :10, well past pingdotgg's commit times to avoid races.
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase fork commits onto upstream
        run: |
          git config user.name "fork sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          # Rebase keeps this workflow on main; a reset would delete it.
          git rebase upstream/main

      - name: Push rebased main
        run: git push origin main --force-with-lease
